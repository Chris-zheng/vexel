name: CI

# Linux and Windows run the full test suite on every push and pull request. macOS (the
# development machine) and the slow regression benchmarks run weekly and on demand, because
# macOS runner minutes on a private repository cost about ten times Linux minutes.
# Every run also builds the wheel and installs it the way testers do, with pinned versions.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run the test suite on macOS"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen  # GUI tests without a display
  UV_PYTHON: "3.12"

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS only on the weekly schedule or when asked for
        os: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.macos)) && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Lock file matches pyproject.toml
        run: uv lock --check
      - name: Install
        run: uv sync --locked --extra agent --extra sem
      - name: Tests
        run: uv run --locked --extra agent --extra sem pytest -q --durations=10

  benchmarks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: uv sync --locked --extra agent --extra sem
      - run: uv run --locked pytest -q -m benchmark

  wheel:
    name: install as a tester (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Build wheel, constraints and checksums
        shell: bash
        run: scripts/build_dist.sh
      - name: Install the wheel with pinned versions into a clean tool environment
        shell: bash
        run: |
          uv tool install "$(ls dist/*.whl)" -c "$(ls dist/*-constraints.txt)"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Smoke test outside the source tree
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          vexel --help > /dev/null
          vexel synth demo --frames 120 --cells 1.0
          vexel run demo/droplets.ome.tif -r droplet_encapsulation -o run --no-input-hash
          vexel validate run --truth demo/truth
          vexel batch run demo -r droplet_basic -o batch --no-input-hash
          test -f run/report.html && test -f batch/report.html && test -f batch/reproduce.py
          vexel bugreport run -o bug.zip
          vexel gui --help > /dev/null
      - name: GUI starts (offscreen)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python_bin="$(uv tool dir)/vexel/$( [ "$RUNNER_OS" = Windows ] && echo Scripts/python.exe || echo bin/python )"
          "$python_bin" -c "from qtpy.QtWidgets import QApplication; app = QApplication([]); from vexel.ui.main_window import MainWindow; w = MainWindow(); w.show(); app.processEvents(); print('main window ok')"
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vexel-dist
          path: dist/

  offline-bundle:
    # Weekly and on demand: build the offline bundle for each platform and install it with
    # no index access, as on a computer without internet (e.g. in a fab).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: offline bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64 }
          - { os: ubuntu-24.04, platform: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Build the bundle
        run: uv run python scripts/build_offline_bundle.py --platform ${{ matrix.platform }} --out offline
      - name: Install offline into clean directories and run an analysis
        shell: bash
        run: |
          b=$(ls -d offline/vexel-*-offline-${{ matrix.platform }})
          t="$RUNNER_TEMP/offline-test"
          export UV_OFFLINE=1 UV_CACHE_DIR="$t/cache" UV_PYTHON_INSTALL_DIR="$t/python" UV_TOOL_DIR="$t/tools" UV_TOOL_BIN_DIR="$t/bin" UV_PYTHON_PREFERENCE=only-managed
          if [ "$RUNNER_OS" = Windows ]; then
            export UV_PYTHON_INSTALL_MIRROR="file:///$(cygpath -m "$PWD/$b/python")"; uvbin="$b/uv/uv.exe"
          else
            export UV_PYTHON_INSTALL_MIRROR="file://$PWD/$b/python"; uvbin="$b/uv/uv"
          fi
          "$uvbin" python install 3.12 --no-bin
          "$uvbin" tool install "$(ls $b/vexel-*.whl)" --python 3.12 --offline --no-index --find-links "$b/wheels" -c "$(ls $b/vexel-*-constraints.txt)"
          cd "$RUNNER_TEMP"
          "$t/bin/vexel" synth demo --frames 80 --cells 1.0
          "$t/bin/vexel" run demo/droplets.ome.tif -r droplet_encapsulation -o run --no-input-hash
          test -f run/report.html
