[project]
name = "vexel"
version = "0.1.0"
description = "Agent-native scientific image analysis: LLM plans, deterministic operators compute."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "dask[array]>=2024.8",
    "zarr>=3.0",
    "tifffile>=2025.5.10",
    "imageio[pyav]>=2.36",
    "pandas>=2.2",
    "pydantic>=2.8",
    "laptrack>=0.16",
    "qtpy>=2.4,<3",
    "pyside6-essentials~=6.12.0",
    "scikit-learn>=1.5",
]

[project.scripts]
vexel = "vexel.cli:main"

[project.gui-scripts]
vexel-gui = "vexel.ui.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # scikit-image internals on NumPy >= 2.5; not ours to fix
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:skimage",
]
