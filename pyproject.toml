[project]
name = "vexel"
version = "0.6.0b1"
description = "Agent-native scientific image analysis: LLM plans, deterministic operators compute."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "dask[array]>=2024.8",
    "zarr>=3.0",
    "tifffile>=2025.5.10",
    "imageio[pyav]>=2.36",
    "pandas>=2.2",
    "pydantic>=2.8",
    "laptrack>=0.16",
    "qtpy>=2.4,<3",
    "pyside6-essentials~=6.12.0",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",  # Excel export of measurement tables
]

[project.scripts]
vexel = "vexel.cli:main"

[project.gui-scripts]
vexel-gui = "vexel.ui.app:main"

[project.optional-dependencies]
agent = [
    "anthropic>=2.8",
    "mcp>=2.3,<3",
]
# SEM data-bar text recognition (offline). Not on Intel Macs: onnxruntime has no wheels there.
# opencv < 5.1: 5.1's macOS wheels need macOS 15 (Vexel supports macOS 14).
sem = [
    "rapidocr>=3.10,<4; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime>=1.26; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "opencv-python-headless>=4.11,<5.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not benchmark'"
markers = ["benchmark: slow regression benchmarks on fixed synthetic data (run with -m benchmark)"]
filterwarnings = [
    # scikit-image internals on NumPy >= 2.5; not ours to fix
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:skimage",
]
